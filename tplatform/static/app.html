<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交易平台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg:      #0f172a;
    --surface: #1e293b;
    --border:  #334155;
    --fg:      #f1f5f9;
    --muted:   #94a3b8;
    --green:   #22c55e;
    --red:     #ef4444;
    --orange:  #f97316;
    --blue:    #3b82f6;
    --accent:  #38bdf8;
    --radius:  12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Login ─────────────────────────────────────────────── */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px 24px;
  }
  .login-card h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .login-card p  { color: var(--muted); font-size: .875rem; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: .8125rem; color: var(--muted); }
  .field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .toggle-link {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: .8125rem;
    margin-top: 14px;
    cursor: pointer;
    text-decoration: underline;
  }
  .error-msg { color: var(--red); font-size: .8125rem; margin-top: 10px; text-align: center; }

  /* ── Shell (after login) ────────────────────────────────── */
  #app-shell { flex: 1; display: none; flex-direction: column; overflow: hidden; }

  /* Tab bar */
  .tab-bar {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    order: 2;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 0 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: .6875rem;
    cursor: pointer;
    transition: color .15s;
    position: relative;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-btn svg { width: 22px; height: 22px; }
  .badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 18px);
    width: 8px; height: 8px;
    background: var(--red);
    border-radius: 50%;
    display: none;
  }
  .badge.show { display: block; }

  /* Content area */
  .pages { flex: 1; overflow-y: auto; order: 1; }
  .page { display: none; padding: 16px; padding-bottom: 24px; }
  .page.active { display: block; }

  /* ── Common components ──────────────────────────────────── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: .75rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .big-num { font-size: 2rem; font-weight: 700; line-height: 1; }
  .green  { color: var(--green); }
  .red    { color: var(--red); }
  .orange { color: var(--orange); }
  .blue   { color: var(--blue); }
  .muted  { color: var(--muted); }

  .row   { display: flex; align-items: center; gap: 10px; }
  .row-sb{ display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .col   { display: flex; flex-direction: column; gap: 4px; }

  .chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: .6875rem;
    font-weight: 700;
    color: #fff;
  }
  .chip.buy   { background: var(--green); }
  .chip.sell  { background: var(--red); }
  .chip.short { background: var(--orange); }
  .chip.cover { background: var(--blue); }

  .stat-row { display: flex; gap: 0; }
  .stat-cell {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-val  { font-size: 1.125rem; font-weight: 600; }
  .stat-lbl  { font-size: .6875rem; color: var(--muted); margin-top: 2px; }

  /* Toggle switch */
  .toggle-wrap { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .toggle-wrap:last-child { border-bottom: none; }
  .toggle-lbl { font-size: .9375rem; }
  .switch { position: relative; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 13px;
    transition: background .2s;
    cursor: pointer;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }

  /* Range slider */
  .range-row { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .range-row:last-child { border-bottom: none; }
  .range-header { display: flex; justify-content: space-between; }
  .range-header span:first-child { font-size: .9375rem; }
  .range-header span:last-child { font-size: .9375rem; font-weight: 600; color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  /* List items */
  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }

  /* Score circle */
  .score-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Connection dot */
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
    transition: background .3s;
  }
  .conn-dot.on { background: var(--green); }

  /* Page header */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .page-header h2 { font-size: 1.25rem; font-weight: 700; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
  }
  .icon-btn:active { color: var(--accent); }

  /* Empty state */
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: .9375rem; }

  /* Loading spinner */
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 48px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Target badge */
  .target-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: .8125rem;
    font-weight: 700;
  }
  .target-badge.hit  { background: rgba(34,197,94,.15); color: var(--green); }
  .target-badge.miss { background: rgba(249,115,22,.15); color: var(--orange); }
</style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <h1>交易平台</h1>
    <p id="login-subtitle">登入以開始使用</p>
    <div class="field">
      <label>Server URL</label>
      <input id="server-url" type="url" placeholder="http://192.168.1.x:30880">
    </div>
    <div class="field">
      <label>Email</label>
      <input id="login-email" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label>密碼</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="submitLogin()">登入</button>
    <span class="toggle-link" onclick="toggleMode()">還沒有帳號？註冊</span>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ── APP SHELL ──────────────────────────────────────────── -->
<div id="app-shell">
  <div class="pages">
    <!-- Dashboard -->
    <div class="page active" id="page-dash">
      <div class="page-header">
        <h2>今日總覽</h2>
        <div class="row" style="gap:8px">
          <div class="conn-dot" id="conn-dot"></div>
          <span style="font-size:.75rem;color:var(--muted)" id="conn-label">離線</span>
          <button class="icon-btn" onclick="loadDash()" title="重新整理">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
      </div>
      <div id="dash-content"><div class="spinner"></div></div>
    </div>

    <!-- Signals -->
    <div class="page" id="page-signals">
      <div class="page-header">
        <h2>AI 信號</h2>
        <button class="icon-btn" onclick="loadSignals()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
      <div id="signals-content"><div class="spinner"></div></div>
    </div>

    <!-- Trades -->
    <div class="page" id="page-trades">
      <div class="page-header">
        <h2>今日交易</h2>
        <button class="icon-btn" onclick="loadTrades()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
      <div id="trades-content"><div class="spinner"></div></div>
    </div>

    <!-- Positions -->
    <div class="page" id="page-positions">
      <div class="page-header">
        <h2>持倉</h2>
        <button class="icon-btn" onclick="loadPositions()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
      <div id="positions-content"><div class="spinner"></div></div>
    </div>

    <!-- Settings -->
    <div class="page" id="page-settings">
      <div class="page-header"><h2>設定</h2></div>
      <div id="settings-content"><div class="spinner"></div></div>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" onclick="showTab('dash')" id="tab-dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      總覽
    </button>
    <button class="tab-btn" onclick="showTab('signals')" id="tab-signals">
      <div class="badge" id="badge-signals"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
      信號
    </button>
    <button class="tab-btn" onclick="showTab('trades')" id="tab-trades">
      <div class="badge" id="badge-trades"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
      交易
    </button>
    <button class="tab-btn" onclick="showTab('positions')" id="tab-positions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      持倉
    </button>
    <button class="tab-btn" onclick="showTab('settings')" id="tab-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      設定
    </button>
  </nav>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let SERVER = '';
let TOKEN  = '';
let WS     = null;
let CFG    = {};
let isRegMode = false;

// Persist across page refresh
try {
  SERVER = localStorage.getItem('server') || location.origin;
  TOKEN  = localStorage.getItem('token') || '';
} catch(e) {}

document.getElementById('server-url').value = SERVER;

if (TOKEN) { showApp(); }

// ── Auth ───────────────────────────────────────────────────
function toggleMode() {
  isRegMode = !isRegMode;
  document.getElementById('login-btn').textContent = isRegMode ? '註冊' : '登入';
  document.getElementById('login-subtitle').textContent = isRegMode ? '建立新帳號' : '登入以開始使用';
  document.querySelector('.toggle-link').textContent = isRegMode ? '已有帳號？登入' : '還沒有帳號？註冊';
  document.getElementById('login-error').textContent = '';
}

async function submitLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  SERVER = (document.getElementById('server-url').value || '').replace(/\/$/, '');
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) return;
  btn.disabled = true;
  err.textContent = '';
  try {
    const path = isRegMode ? '/auth/register' : '/auth/login';
    const r = await fetch(SERVER + path, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass, display_name: ''})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Error ' + r.status);
    TOKEN = d.access_token;
    try { localStorage.setItem('token', TOKEN); localStorage.setItem('server', SERVER); } catch(e) {}
    showApp();
  } catch(e) {
    err.textContent = e.message;
  }
  btn.disabled = false;
}
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });

function logout() {
  TOKEN = '';
  try { localStorage.removeItem('token'); } catch(e) {}
  if (WS) { WS.close(); WS = null; }
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ── App Shell ──────────────────────────────────────────────
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  loadDash();
  loadSignals();
  connectWS();
}

// ── Tab Navigation ─────────────────────────────────────────
let activeTab = 'dash';
function showTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  activeTab = tab;
  if (tab === 'dash')      loadDash();
  if (tab === 'signals')   { loadSignals(); clearBadge('signals'); }
  if (tab === 'trades')    { loadTrades();  clearBadge('trades'); }
  if (tab === 'positions') loadPositions();
  if (tab === 'settings')  loadSettings();
}
function showBadge(id) { document.getElementById('badge-' + id).classList.add('show'); }
function clearBadge(id){ document.getElementById('badge-' + id).classList.remove('show'); }

// ── API helpers ────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(SERVER + path, opts);
  if (r.status === 401) { logout(); return null; }
  return r.json();
}
const GET  = path       => api('GET', path);
const PUT  = (path, b)  => api('PUT',  path, b);

function fmt(n) {
  if (n === null || n === undefined) return '—';
  const s = Math.abs(n) >= 10000 ? (n/10000).toFixed(1) + '萬' : n.toFixed(0);
  return (n >= 0 ? '+' : '') + s;
}

// ── Dashboard ──────────────────────────────────────────────
async function loadDash() {
  const [sum, cfg] = await Promise.all([GET('/api/summary'), GET('/api/config')]);
  if (!sum || !cfg) return;
  CFG = cfg;
  const pnlColor = sum.total_pnl >= 0 ? 'green' : 'red';
  document.getElementById('dash-content').innerHTML = `
    <div class="card">
      <div class="card-title">今日損益</div>
      <div class="row-sb" style="align-items:flex-end">
        <div class="big-num ${pnlColor}">${fmt(sum.total_pnl)} 元</div>
        <span class="target-badge ${sum.hit_target ? 'hit' : 'miss'}">${sum.hit_target ? '✓ 達標' : '未達標'}</span>
      </div>
      <div style="font-size:.8rem;color:var(--muted);margin-top:6px">目標 ${fmt(sum.target_pnl)} 元</div>
      <div class="stat-row" style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
        <div class="stat-cell"><div class="stat-val">${sum.trade_count}</div><div class="stat-lbl">交易次數</div></div>
        <div class="stat-cell"><div class="stat-val">${sum.win_count}</div><div class="stat-lbl">獲利次數</div></div>
        <div class="stat-cell"><div class="stat-val">${(sum.win_rate*100).toFixed(0)}%</div><div class="stat-lbl">勝率</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">交易設定</div>
      ${toggleRow('auto_trade', '真實自動下單', cfg.auto_trade)}
      ${toggleRow('real_enable_day', '真實當沖（做多）', cfg.real_enable_day)}
      ${toggleRow('enable_day', '模擬當沖（做多）', cfg.enable_day)}
      ${toggleRow('enable_short', '模擬反沖（做空）', cfg.enable_short)}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
        <span style="color:var(--muted);font-size:.875rem">真實單筆額度</span>
        <span style="font-size:.875rem">${(cfg.day_budget/10000).toFixed(0)} 萬元</span>
      </div>
    </div>`;
}

function toggleRow(key, label, val) {
  return `<div class="toggle-wrap">
    <span class="toggle-lbl">${label}</span>
    <label class="switch">
      <input type="checkbox" ${val ? 'checked' : ''} onchange="patchConfig('${key}', this.checked)">
      <span class="slider"></span>
    </label>
  </div>`;
}

async function patchConfig(key, val) {
  await PUT('/api/config', { [key]: val });
}

// ── Signals ────────────────────────────────────────────────
async function loadSignals() {
  const rows = await GET('/api/signals');
  if (!rows) return;
  if (!rows.length) {
    document.getElementById('signals-content').innerHTML = '<div class="empty">今日無信號</div>';
    return;
  }
  const colorMap = { BUY:'green', SELL:'red', SHORT:'orange', COVER:'blue' };
  document.getElementById('signals-content').innerHTML = `
    <div class="card" style="padding:0">
      ${rows.map(s => `
        <div class="list-item" style="padding:12px 16px">
          <div class="score-circle" style="border-color:var(--${colorMap[s.action]||'muted'});color:var(--${colorMap[s.action]||'muted'})">${s.score}</div>
          <div class="col" style="flex:1;min-width:0">
            <div class="row" style="gap:6px">
              <span style="font-weight:700">${s.code}</span>
              <span class="chip ${s.action.toLowerCase()}">${s.action}</span>
            </div>
            <span style="font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.reason||''}</span>
          </div>
          <span style="font-weight:700;white-space:nowrap">$${s.price.toFixed(1)}</span>
        </div>`).join('')}
    </div>`;
}

// ── Trades ─────────────────────────────────────────────────
async function loadTrades() {
  const rows = await GET('/api/trades');
  if (!rows) return;
  if (!rows.length) {
    document.getElementById('trades-content').innerHTML = '<div class="empty">今日無交易記錄</div>';
    return;
  }
  const colorMap = { BUY:'green', SELL:'red', SHORT:'orange', COVER:'blue' };
  document.getElementById('trades-content').innerHTML = `
    <div class="card" style="padding:0">
      ${rows.map(t => {
        const isSell = t.action === 'SELL' || t.action === 'COVER';
        const pnlHtml = isSell
          ? `<span style="font-size:.8125rem;font-weight:700;color:var(--${t.pnl>=0?'green':'red'})">${fmt(t.pnl)}</span>`
          : '';
        return `<div class="list-item" style="padding:12px 16px">
          <span class="chip ${t.action.toLowerCase()}" style="flex-shrink:0">${t.action}</span>
          <div class="col" style="flex:1;min-width:0">
            <span style="font-weight:700">${t.code}</span>
            <span style="font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.reason||''}</span>
          </div>
          <div class="col" style="align-items:flex-end;gap:2px">
            <span style="font-size:.875rem">${t.shares} 股 $${t.price.toFixed(1)}</span>
            ${pnlHtml}
            <span style="font-size:.6875rem;color:var(--${t.is_real?'orange':'blue'})">${t.is_real?'真實':'模擬'}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── Positions ──────────────────────────────────────────────
async function loadPositions() {
  const rows = await GET('/api/positions');
  if (!rows) return;
  if (!rows.length) {
    document.getElementById('positions-content').innerHTML = '<div class="empty">目前無持倉</div>';
    return;
  }
  document.getElementById('positions-content').innerHTML = `
    <div class="card" style="padding:0">
      ${rows.map(p => `
        <div class="list-item" style="padding:12px 16px">
          <span class="chip ${p.direction==='SHORT'?'short':'buy'}" style="flex-shrink:0">${p.direction==='SHORT'?'反沖':'當沖'}</span>
          <div class="col" style="flex:1">
            <span style="font-weight:700">${p.code}</span>
            <span style="font-size:.75rem;color:var(--muted)">成本 $${p.entry_price.toFixed(1)}</span>
          </div>
          <div class="col" style="align-items:flex-end">
            <span style="font-size:.875rem">${p.shares} 股</span>
            <span style="font-size:.6875rem;color:var(--${p.is_real?'orange':'blue'})">${p.is_real?'真實':'模擬'}</span>
          </div>
        </div>`).join('')}
    </div>`;
}

// ── Settings ───────────────────────────────────────────────
async function loadSettings() {
  const cfg = await GET('/api/config');
  if (!cfg) return;
  CFG = cfg;
  const st = await GET('/api/bot-status') || {available:false};
  const canReal = st.available && st.real_trading_enabled && st.fubon_logged_in && st.real_order_connected;
  const stText = !st.available ? '伺服器尚未回報狀態'
    : !st.real_trading_enabled ? '伺服器未開啟真實交易'
    : !st.fubon_logged_in ? '富邦未登入，無法下單'
    : !st.real_order_connected ? '真實下單未接上'
    : st.live_quote_ok === false ? '富邦即時報價異常，暫不下單'
    : '可真實下單（富邦即時報價）';
  document.getElementById('settings-content').innerHTML = `
    <div class="card">
      <div class="card-title">真實交易（富邦）</div>
      <div style="font-size:.8125rem;margin-bottom:6px;color:var(--${canReal?'green':'orange'})">${canReal?'✓':'⚠'} ${stText}</div>
      ${toggleRow('auto_trade', '自動下單（真實）', cfg.auto_trade)}
      ${toggleRow('real_enable_day', '當沖（做多）', cfg.real_enable_day)}
      ${toggleRow('real_enable_short', '反沖（做空）' + (st.real_short_supported ? '' : '（伺服器尚未支援）'), cfg.real_enable_short)}
    </div>

    <div class="card">
      <div class="card-title">模擬交易（只做紙上）</div>
      ${toggleRow('enable_day', '當沖（做多）', cfg.enable_day)}
      ${toggleRow('enable_short', '反沖（做空）', cfg.enable_short)}
      ${toggleRow('enable_overnight', '隔日沖', cfg.enable_overnight)}
    </div>

    <div class="card">
      <div class="card-title">真實交易額度（一天總額 = 單筆 × 最大持倉）</div>
      <div class="range-row">
        <div class="range-header">
          <span>單筆額度</span>
          <span id="budget-label">${(cfg.day_budget/10000).toFixed(0)} 萬元</span>
        </div>
        <input type="range" min="10000" max="500000" step="10000" value="${cfg.day_budget}"
          oninput="document.getElementById('budget-label').textContent=(this.value/10000).toFixed(0)+'萬元'"
          onchange="patchConfig('day_budget', +this.value)">
      </div>
      <div class="range-row">
        <div class="range-header">
          <span>最大持倉數</span>
          <span id="maxpos-label">${cfg.max_positions} 檔</span>
        </div>
        <input type="range" min="1" max="10" step="1" value="${cfg.max_positions}"
          oninput="document.getElementById('maxpos-label').textContent=this.value+'檔'"
          onchange="patchConfig('max_positions', +this.value)">
      </div>
    </div>

    <div class="card">
      <div class="card-title">帳號</div>
      <div class="toggle-wrap" style="border:none">
        <span class="toggle-lbl" style="color:var(--muted);font-size:.875rem">Server: ${SERVER}</span>
      </div>
      <button class="btn-primary" style="background:var(--red);margin-top:4px" onclick="logout()">登出</button>
    </div>`;
}

// ── WebSocket ──────────────────────────────────────────────
function connectWS() {
  if (WS) return;
  try {
    // decode user_id from JWT
    const payload = JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const uid = payload.sub;
    const wsUrl = SERVER.replace('https://','wss://').replace('http://','ws://') + '/ws/' + uid + '?token=' + TOKEN;
    WS = new WebSocket(wsUrl);
    WS.onopen = () => { setConn(true); };
    WS.onclose = () => { setConn(false); WS = null; setTimeout(connectWS, 5000); };
    WS.onerror = () => { setConn(false); };
    WS.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        handleWS(msg);
      } catch(_) {}
    };
  } catch(_) {}
}

function setConn(on) {
  document.getElementById('conn-dot').className = 'conn-dot' + (on ? ' on' : '');
  document.getElementById('conn-label').textContent = on ? 'Agent 連線中' : '離線';
}

function handleWS(msg) {
  if (msg.type === 'ping') { WS && WS.send(JSON.stringify({type:'pong'})); return; }
  if (msg.type === 'signal') {
    showBadge('signals');
    if (activeTab === 'signals') loadSignals();
    else if (activeTab === 'dash') loadDash();
  }
  if (msg.type === 'trade_update') {
    showBadge('trades');
    if (activeTab === 'trades')   loadTrades();
    else if (activeTab === 'dash') loadDash();
  }
  if (msg.type === 'position_update') {
    if (activeTab === 'positions') loadPositions();
  }
  if (msg.type === 'config_update') {
    if (activeTab === 'settings') loadSettings();
    else if (activeTab === 'dash') loadDash();
  }
}
</script>
