apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Prometheus 自身
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Node Exporter（節點 CPU/RAM/Disk）
      - job_name: node-exporter
        static_configs:
          - targets: ['node-exporter.monitoring.svc:9100']

      # kube-state-metrics（pod status / resource requests / limits）
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']

      # Trading Bot 自訂 metrics（持倉、損益、現金）
      - job_name: trading-exporter
        static_configs:
          - targets: ['trading-exporter.monitoring.svc:9877']

      # k3s 內建 metrics API
      - job_name: k3s-metrics
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ['kubernetes.default.svc:443']
        metrics_path: /metrics
