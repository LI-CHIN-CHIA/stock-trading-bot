apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.monitoring.svc:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "15s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: Trading Bot
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trading
  namespace: monitoring
data:
  trading.json: |
    {
      "title": "Trading Bot",
      "uid": "trading-bot-v2",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "Asia/Taipei",
      "panels": [
        {
          "id": 1,
          "gridPos": {"h": 4, "w": 5, "x": 0, "y": 0},
          "type": "stat",
          "title": "💰 現金 (Live)",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 10000},
                  {"color": "green", "value": 30000}
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_cash_twd{mode=\"live\"}",
              "instant": true,
              "legendFormat": "現金 TWD"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": {"h": 4, "w": 5, "x": 5, "y": 0},
          "type": "stat",
          "title": "📈 持倉市值 (Live)",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "blue"},
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_holding_value_twd{mode=\"live\"}",
              "instant": true,
              "legendFormat": "持倉市值"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": {"h": 4, "w": 5, "x": 10, "y": 0},
          "type": "stat",
          "title": "💎 總資產 (Live)",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 50000}
                ]
              },
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_total_value_twd{mode=\"live\"}",
              "instant": true,
              "legendFormat": "總資產"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": {"h": 4, "w": 4, "x": 15, "y": 0},
          "type": "stat",
          "title": "📊 持倉支數",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "orange"},
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_position_count{mode=\"live\"}",
              "instant": true,
              "legendFormat": "持倉數"
            }
          ]
        },
        {
          "id": 5,
          "gridPos": {"h": 4, "w": 5, "x": 19, "y": 0},
          "type": "stat",
          "title": "📋 總交易次數",
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_total_buy_trades{mode=\"live\"} + trading_total_sell_trades{mode=\"live\"}",
              "instant": true,
              "legendFormat": "總交易"
            }
          ]
        },
        {
          "id": 10,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "type": "timeseries",
          "title": "總資產走勢",
          "options": {
            "tooltip": {"mode": "single"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 2, "fillOpacity": 10}
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_total_value_twd{mode=\"live\"}",
              "legendFormat": "Live 總資產"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_total_value_twd{mode=\"paper\"}",
              "legendFormat": "Paper 總資產"
            }
          ]
        },
        {
          "id": 11,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "type": "timeseries",
          "title": "現金 vs 持倉市值",
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 2}
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_cash_twd{mode=\"live\"}",
              "legendFormat": "現金"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_holding_value_twd{mode=\"live\"}",
              "legendFormat": "持倉市值"
            }
          ]
        },
        {
          "id": 20,
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "type": "table",
          "title": "目前持倉明細 (Live)",
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "未實現損益", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {"decimals": 0},
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "未實現損益"},
                "properties": [
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "thresholds", "value": {
                    "mode": "absolute",
                    "steps": [{"color": "red","value": null}, {"color": "green","value": 0}]
                  }},
                  {"id": "custom.thresholdsStyle", "value": {"mode": "background"}}
                ]
              }
            ]
          },
          "transformations": [
            {"id": "merge", "options": {}},
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "Value #A": "股數",
                  "Value #B": "成本價",
                  "Value #C": "總成本",
                  "Value #D": "未實現損益",
                  "Value #E": "持有天數",
                  "ticker": "股票代號"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "trading_position_shares{mode=\"live\"}",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_position_entry_price{mode=\"live\"}",
              "instant": true,
              "legendFormat": "",
              "refId": "B"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_position_cost{mode=\"live\"}",
              "instant": true,
              "legendFormat": "",
              "refId": "C"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_position_unrealized_pnl{mode=\"live\"}",
              "instant": true,
              "legendFormat": "",
              "refId": "D"
            },
            {
              "datasource": "Prometheus",
              "expr": "trading_position_hold_days{mode=\"live\"}",
              "instant": true,
              "legendFormat": "",
              "refId": "E"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: monitoring
data:
  infra.json: |
    {
      "title": "K8s Infrastructure",
      "uid": "k8s-infra-v2",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "Asia/Taipei",
      "panels": [
        {
          "id": 1,
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "type": "gauge",
          "title": "Node CPU 使用率",
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "minVizWidth": 75},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0, "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)",
              "instant": true,
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "id": 2,
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "type": "gauge",
          "title": "Node RAM 使用率",
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "minVizWidth": 75},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0, "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 75},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "instant": true,
              "legendFormat": "RAM %"
            }
          ]
        },
        {
          "id": 3,
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "type": "stat",
          "title": "RAM 可用",
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "color": {"mode": "fixed", "fixedColor": "blue"},
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "node_memory_MemAvailable_bytes",
              "instant": true,
              "legendFormat": "可用 RAM"
            }
          ]
        },
        {
          "id": 4,
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "type": "stat",
          "title": "Running Pods",
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {"mode": "fixed", "fixedColor": "green"},
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)",
              "instant": true,
              "legendFormat": "Running Pods"
            }
          ]
        },
        {
          "id": 10,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "type": "timeseries",
          "title": "Pod CPU (trading namespace) — millicores",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 1}
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"trading\",container!=\"\",container!=\"POD\"}[2m])) * 1000",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 11,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "type": "timeseries",
          "title": "Pod Memory (trading namespace)",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"lineWidth": 1}
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "container_memory_working_set_bytes{namespace=\"trading\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 20,
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 12},
          "type": "table",
          "title": "所有 Pod 狀態",
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"decimals": 0}},
          "transformations": [
            {"id": "merge", "options": {}},
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "phase": "Phase",
                  "Value": "狀態值"
                },
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "job": true,
                  "uid": true,
                  "Value": true
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "kube_pod_status_phase{phase=\"Running\"} == 1",
              "instant": true,
              "legendFormat": "",
              "refId": "A"
            }
          ]
        }
      ]
    }
