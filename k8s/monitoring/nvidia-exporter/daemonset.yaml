apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: nvidia-exporter
  template:
    metadata:
      labels:
        app: nvidia-exporter
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: nvidia-exporter
          image: nvidia-exporter:latest
          imagePullPolicy: Never
          securityContext:
            privileged: true
          ports:
            - containerPort: 9878
          env:
            - name: PORT
              value: "9878"
            - name: INTERVAL
              value: "10"
            - name: LD_LIBRARY_PATH
              value: "/nvidia-libs"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nvidia-smi-bin
              mountPath: /usr/bin/nvidia-smi
            - name: nvidia-ml-lib
              mountPath: /nvidia-libs/libnvidia-ml.so.595.84
              readOnly: true
            - name: nvidia-ml-lib-so1
              mountPath: /nvidia-libs/libnvidia-ml.so.1
              readOnly: true
            - name: dev-nvidia0
              mountPath: /dev/nvidia0
            - name: dev-nvidiactl
              mountPath: /dev/nvidiactl
            - name: dev-nvidia-modeset
              mountPath: /dev/nvidia-modeset
            - name: dev-nvidia-uvm
              mountPath: /dev/nvidia-uvm
            - name: dev-nvidia-uvm-tools
              mountPath: /dev/nvidia-uvm-tools
      volumes:
        - name: nvidia-smi-bin
          hostPath:
            path: /usr/bin/nvidia-smi
            type: File
        - name: nvidia-ml-lib
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.595.84
            type: File
        - name: nvidia-ml-lib-so1
          hostPath:
            path: /lib/x86_64-linux-gnu/libnvidia-ml.so.595.84
            type: File
        - name: dev-nvidia0
          hostPath:
            path: /dev/nvidia0
        - name: dev-nvidiactl
          hostPath:
            path: /dev/nvidiactl
        - name: dev-nvidia-modeset
          hostPath:
            path: /dev/nvidia-modeset
        - name: dev-nvidia-uvm
          hostPath:
            path: /dev/nvidia-uvm
        - name: dev-nvidia-uvm-tools
          hostPath:
            path: /dev/nvidia-uvm-tools
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-exporter
  namespace: monitoring
spec:
  selector:
    app: nvidia-exporter
  ports:
    - port: 9878
      targetPort: 9878
