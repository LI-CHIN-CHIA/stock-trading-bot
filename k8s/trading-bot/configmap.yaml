apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: trading
data:
  PAPER_TRADING: "false"
  MODEL_TYPE: "double_ensemble"
  ENABLE_TRADING_AGENTS: "true"
  TA_DEEP_MODEL: "qwen3:32b"
  TA_QUICK_MODEL: "qwen3:8b"
  TA_HOLDING_TTL_MIN: "90"
  TA_SCAN_TTL_MIN: "480"
  OLLAMA_HOST: "http://ollama:11434"
  ENABLE_DAY_TRADING: "true"
  ENABLE_OVERNIGHT_TRADING: "true"
  OVERNIGHT_INITIAL_CAPITAL: "300000"
  OVERNIGHT_MAX_POSITIONS: "3"
  OVERNIGHT_STOP_LOSS_PCT: "-0.02"
  OVERNIGHT_TAKE_PROFIT_PCT: "0.03"
  DAY_INITIAL_CAPITAL: "1500000"
  DAY_PER_TRADE_PCT: "0.25"
  DAY_MAX_POSITIONS: "3"
  DAY_STOP_LOSS_PCT: "-0.015"
  DAY_TAKE_PROFIT_PCT: "0.025"
  DAY_MODEL_THRESHOLD: "0.008"
  DATA_DIR: "/data"
  MIN_CASH_RESERVE_PCT: "0.20"
  TELEGRAM_CHAT_ID: "6197828719"
  VOL_SURGE_ALERT_X: "3.0"
  DRAWDOWN_BREAKER_PCT: "0.15"
  SECTOR_MAX_POSITIONS: "2"
