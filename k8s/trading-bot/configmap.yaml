apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: trading
data:
  PAPER_TRADING: "true"
  MODEL_TYPE: "ensemble"
  ENABLE_TRADING_AGENTS: "true"
  TA_DEEP_MODEL: "qwen2.5:32b"
  TA_QUICK_MODEL: "qwen2.5:14b"
  TA_HOLDING_TTL_MIN: "90"
  TA_SCAN_TTL_MIN: "480"
  OLLAMA_HOST: "http://ollama:11434"
  DATA_DIR: "/data"
  MIN_CASH_RESERVE_PCT: "0.20"
  DRAWDOWN_BREAKER_PCT: "0.15"
  SECTOR_MAX_POSITIONS: "2"
